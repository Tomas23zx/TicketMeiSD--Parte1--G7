name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: luisgsousaa

jobs:
  validate:
    name: Validate source and manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install service dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          for requirements in api-gateway catalog order notification; do
            python -m pip install -r "${requirements}/requirements.txt"
          done

      - name: Validate Python syntax
        shell: bash
        run: |
          python -m py_compile \
            api-gateway/main.py \
            catalog/main.py \
            order/main.py \
            notification/main.py

      - name: Validate Kubernetes manifests
        run: kubectl kustomize k8s > /dev/null

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  publish:
    name: Build, publish images and update K8s tags
    needs: validate
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed files per service (RNF4)
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            catalog:
              - 'catalog/**'
            order:
              - 'order/**'
            notification:
              - 'notification/**'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API Gateway
        if: steps.filter.outputs.api-gateway == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ticketmei-api-gateway:${{ github.sha }}

      - name: Build and push Catalog
        if: steps.filter.outputs.catalog == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./catalog
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ticketmei-catalog:${{ github.sha }}

      - name: Build and push Order
        if: steps.filter.outputs.order == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./order
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ticketmei-order:${{ github.sha }}

      - name: Build and push Notification
        if: steps.filter.outputs.notification == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./notification
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ticketmei-notification:${{ github.sha }}

      - name: Update Kubernetes image tags
        shell: bash
        run: |
          has_updates=false

          if [ "${{ steps.filter.outputs.api-gateway }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sed -i -E "s#(image: ghcr.io/${IMAGE_OWNER}/ticketmei-api-gateway:).*#\1${GITHUB_SHA}#" "k8s/api-gateway/deployment.yaml"
            has_updates=true
          fi

          if [ "${{ steps.filter.outputs.catalog }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sed -i -E "s#(image: ghcr.io/${IMAGE_OWNER}/ticketmei-catalog:).*#\1${GITHUB_SHA}#" "k8s/catalog/deployment.yaml"
            has_updates=true
          fi

          if [ "${{ steps.filter.outputs.order }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sed -i -E "s#(image: ghcr.io/${IMAGE_OWNER}/ticketmei-order:).*#\1${GITHUB_SHA}#" "k8s/order/deployment.yaml"
            has_updates=true
          fi

          if [ "${{ steps.filter.outputs.notification }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sed -i -E "s#(image: ghcr.io/${IMAGE_OWNER}/ticketmei-notification:).*#\1${GITHUB_SHA}#" "k8s/notification/deployment.yaml"
            has_updates=true
          fi

          echo "HAS_UPDATES=${has_updates}" >> "$GITHUB_ENV"

      - name: Commit updated Kubernetes manifests
        if: env.HAS_UPDATES == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s
          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes to commit."
            exit 0
          fi
          git commit -m "chore: deploy images ${GITHUB_SHA::12}"
          git push

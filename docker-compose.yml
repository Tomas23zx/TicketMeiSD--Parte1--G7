networks:
  ticketmei-net:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - ticketmei-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ticketmei-net

  catalog:
    build: ./catalog
    container_name: catalog
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data:ro
    networks:
      - ticketmei-net

  order:
    build: ./order
    container_name: order
    ports:
      - "8002:8002"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_PATH: /app/data/order.db
    volumes:
      - ./data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketmei-net

  notification:
    build: ./notification
    container_name: notification
    ports:
      - "8003:8003"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_PATH: /app/data/notification.db
      LOGS_FILE: /app/data/notification_logs.json
    volumes:
      - ./data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketmei-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      CATALOG_URL: http://catalog:8001
      ORDER_URL: http://order:8002
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_ORDER_REQUESTS: 5
      RATE_LIMIT_ORDER_WINDOW_SECONDS: 1
    depends_on:
      catalog:
        condition: service_started
      order:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ticketmei-net

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - ticketmei-net

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard1.json:/var/lib/grafana/dashboards/gateway.json:ro
      - ./dashboard2.json:/var/lib/grafana/dashboards/phase2.json:ro
    depends_on:
      - prometheus
    networks:
      - ticketmei-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - ticketmei-net

  k6:
    image: grafana/k6:0.49.0
    container_name: k6
    user: root
    working_dir: /ci-scripts
    volumes:
      - ./k6:/ci-scripts
    command: run load-test.js
    depends_on:
      - api-gateway
    networks:
      - ticketmei-net
    profiles:
      - testing
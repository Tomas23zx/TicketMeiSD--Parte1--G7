apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ticketmei
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/luisgsousaa/ticketmei-api-gateway:7fca8975785acdf910f00257d38f62bf2492772a
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CATALOG_URL
              value: http://catalog:8001
            - name: ORDER_URL
              value: http://order:8002
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: RATE_LIMIT_REQUESTS
              value: "100"
            - name: RATE_LIMIT_WINDOW_SECONDS
              value: "60"
            - name: RATE_LIMIT_ORDER_REQUESTS
              value: "5"
            - name: RATE_LIMIT_ORDER_WINDOW_SECONDS
              value: "1"
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

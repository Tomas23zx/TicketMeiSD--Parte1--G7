apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: ticketmei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: ghcr.io/luisgsousaa/ticketmei-inventory:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8005
          env:
            - name: DATABASE_PATH
              value: /app/data/inventory.db
            - name: EVENTS_FILE
              value: /app/data/events.json
          volumeMounts:
            - name: inventory-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: inventory-data
          persistentVolumeClaim:
            claimName: inventory-data

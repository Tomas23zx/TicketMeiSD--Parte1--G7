apiVersion: batch/v1
kind: Job
metadata:
  name: ticketmei-rate-limit-test
  namespace: ticketmei
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          command:
            - k6
            - run
            - /scripts/rate-limit-test.js
          volumeMounts:
            - name: script
              mountPath: /scripts/rate-limit-test.js
              subPath: rate-limit-test.js
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: ticketmei-k6-rate-limit

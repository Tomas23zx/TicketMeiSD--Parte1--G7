apiVersion: batch/v1
kind: Job
metadata:
  name: ticketmei-load-test-resilience
  namespace: ticketmei
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          command:
            - k6
            - run
            - /scripts/load_test_payment_resilience.js
          env:
            - name: GATEWAY_URL
              value: http://api-gateway:8000
          volumeMounts:
            - name: script
              mountPath: /scripts/load_test_payment_resilience.js
              subPath: load_test_payment_resilience.js
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: ticketmei-k6-resilience

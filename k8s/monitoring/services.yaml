apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ticketmei
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ticketmei
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ticketmei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: ghcr.io/luisgsousaa/ticketmei-order:f152874b2ed8cac4b30d2735bd38884d60b40f3b
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/
            - name: DATABASE_PATH
              value: /app/data/order.db
          volumeMounts:
            - name: order-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: order-data
          persistentVolumeClaim:
            claimName: order-data

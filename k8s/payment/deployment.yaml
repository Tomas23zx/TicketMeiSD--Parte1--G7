apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: ticketmei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: ghcr.io/luisgsousaa/ticketmei-payment:c9cd5edc84ec1da27f32a9981f22c89df9a8f394
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8004
          env:
            - name: DATABASE_PATH
              value: /app/data/payment.db
          volumeMounts:
            - name: payment-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: payment-data
          persistentVolumeClaim:
            claimName: payment-data
